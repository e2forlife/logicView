<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogicView</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="app">
    <header class="titlebar">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 14h3l2-6 3 10 2-7 2 3h6"></path>
      </svg>
      <strong>LogicView</strong>
    </header>
    <nav class="menubar" aria-label="Menu">
      <button type="button" data-menu="file">File</button>
      <button type="button" data-menu="edit">Edit</button>
      <button type="button" data-menu="capture">Capture</button>
      <button type="button" data-menu="view">View</button>
      <button type="button" data-menu="decode">Decode</button>
      <button type="button" data-menu="measure">Measure</button>
      <button type="button" data-menu="tools">Tools</button>
      <button type="button" data-menu="help">Help</button>
    </nav>
    <div class="toolbar">
      <div class="device-chip" title="Device">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="10" rx="2"></rect><path d="M8 7V5M12 7V5M16 7V5M8 19v-2M12 19v-2M16 19v-2"></path></svg>
        <span class="device-meta">
          <strong id="device-name">Demo</strong>
          <span class="connected"><i class="dot"></i> Connected</span>
        </span>
        <span class="chev" aria-hidden="true">▾</span>
        <button id="device-select" type="button" aria-haspopup="menu" aria-label="Device"></button>
      </div>
      <button id="run" class="run" type="button" title="Run capture">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z"></path></svg>
        Run
      </button>
      <button id="stop" class="stop" type="button" title="Stop capture">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"></rect></svg>
        Stop
      </button>
      <div class="tool-group" aria-label="Trigger">
        <svg class="trig-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16h4l2-8 3 10 2-6h7"></path></svg>
        <label class="check tight"><input id="trig-enable" type="checkbox"> Trigger</label>
        <select id="trig-channel" aria-label="Trigger channel"></select>
        <select id="trig-edge" aria-label="Trigger edge">
          <option value="rising">Rising</option>
          <option value="falling">Falling</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
        <label class="tiny">Pre-trigger
          <select id="trig-percent" aria-label="Pre-trigger">
            <option value="0">0%</option>
            <option value="10" selected>10%</option>
            <option value="25">25%</option>
            <option value="50">50%</option>
            <option value="90">90%</option>
          </select>
        </label>
      </div>
      <div class="spacer"></div>
      <button id="zoom-out" class="icon-btn" type="button" title="Zoom out" aria-label="Zoom out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"></circle><path d="M7 10h6M14.5 14.5L20 20"></path></svg>
      </button>
      <button id="zoom-in" class="icon-btn" type="button" title="Zoom in" aria-label="Zoom in">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"></circle><path d="M10 7v6M7 10h6M14.5 14.5L20 20"></path></svg>
      </button>
      <input id="timebase" type="range" min="0" max="18" value="14" aria-label="Time per division">
      <span id="timebase-label">50 ms/div</span>
      <button id="tool-marker" class="icon-btn" type="button" title="Place cursors" aria-label="Place cursors">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18M6 4h11l-3 4 3 4H6"></path></svg>
      </button>
      <select id="cursor-mode" aria-label="Cursor placement" title="Cursor placement">
        <option value="single">Single</option>
        <option value="pair">Pair</option>
      </select>
      <button id="tool-measure" class="icon-btn" type="button" title="Add measurement" aria-label="Add measurement">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8v8M19 8v8M5 12h14M8 12l-2-2M8 12l-2 2M16 12l2-2M16 12l2 2"></path></svg>
      </button>
    </div>
    <div class="workspace">
      <div class="wave-column">
        <div class="wave-main">
          <div class="gutter-col">
            <div class="gutter-head">
              <span>Channels</span>
              <button id="channel-add" type="button" title="Devices">+</button>
            </div>
            <div id="gutter"></div>
          </div>
          <div class="canvas-col">
            <canvas id="ruler"></canvas>
            <div class="wave-stage">
              <canvas id="wave"></canvas>
              <button id="edge-prev" class="edge-btn edge-prev hidden" type="button" title="Previous edge" aria-label="Previous edge">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"></path></svg>
              </button>
              <button id="edge-next" class="edge-btn edge-next hidden" type="button" title="Next edge" aria-label="Next edge">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l6 6-6 6"></path></svg>
              </button>
            </div>
          </div>
        </div>
        <canvas id="overview"></canvas>
        <div id="split-bottom" class="h-split" role="separator" aria-orientation="horizontal" title="Resize decode panel"></div>
        <div id="table-panel">
          <div class="table-bar">
            <button type="button" class="table-tab active" data-tab="decoded">Decoded</button>
            <button type="button" class="table-tab" data-tab="edges">Edges</button>
            <input id="table-search" type="search" placeholder="Search or A0-10-5A" aria-label="Search annotations">
            <button id="table-export" type="button">Export</button>
          </div>
          <div id="table-body"></div>
        </div>
        <div class="session-bar">
          <div id="tabs" class="tabs"></div>
          <button id="tab-add" class="tab-add" type="button" title="New session">+</button>
        </div>
        <div id="status" class="status">idle</div>
      </div>
      <div id="split-side" class="v-split" role="separator" aria-orientation="vertical" title="Resize side panel"></div>
      <aside class="side-panel" id="side-panel">
        <div class="side-rail" role="tablist" aria-label="Side panel">
          <button id="side-pin" type="button" title="Pin sidebar" aria-label="Pin sidebar" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3zM12 15v5"></path></svg>
          </button>
          <button type="button" data-tab="device" class="active" title="Device" aria-label="Device">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="10" rx="2"></rect><path d="M8 7V5M12 7V5M16 7V5M8 19v-2M12 19v-2M16 19v-2"></path></svg>
          </button>
          <button type="button" data-tab="decode" title="Decode" aria-label="Decode">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h4l2 4 2-6 2 8 2-6h4"></path></svg>
          </button>
          <button type="button" data-tab="cursors" title="Cursors" aria-label="Cursors">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v18M7 4h10l-3 4 3 4H7"></path></svg>
          </button>
          <button type="button" data-tab="measure" title="Measure" aria-label="Measure">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8v8M19 8v8M5 12h14"></path></svg>
          </button>
          <button type="button" data-tab="export" title="Export" aria-label="Export">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10M8 10l4 4 4-4M5 19h14"></path></svg>
          </button>
        </div>
        <div class="side-sheet">
          <div id="side-body" class="side-body"></div>
        </div>
      </aside>
    </div>
  </div>
  <div id="menu-pop" class="menu-pop hidden"></div>
  <div id="device-menu" class="device-menu hidden" role="menu"></div>
  <div id="bus-menu" class="menu-pop hidden"></div>
  <div id="hover" class="hover hidden"></div>
  <div id="capture-wait" class="wait-dialog hidden" role="dialog" aria-live="polite" aria-label="Capture progress">
    <div class="wait-card">
      <svg class="radial" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="radial-track" cx="60" cy="60" r="46"></circle>
        <circle id="wait-arc" class="radial-value" cx="60" cy="60" r="46"></circle>
        <circle id="wait-spin" class="radial-spin" cx="60" cy="60" r="46"></circle>
      </svg>
      <p id="wait-text">Sampling</p>
    </div>
  </div>
  <div id="bus-dialog" class="wait-dialog hidden" role="dialog" aria-label="Group a bus">
    <form class="wait-card bus-card" id="bus-form">
      <h2>Group a bus</h2>
      <label class="field">Name <input id="bus-name" type="text" value="Bus 1"></label>
      <div id="bus-channels"></div>
      <div class="bus-actions">
        <button type="button" id="bus-cancel">Cancel</button>
        <button type="submit">Create</button>
      </div>
    </form>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
