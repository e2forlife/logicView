[package]
name = "logicview-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "LogicView demo application"

[[bin]]
name = "logicview"
path = "src/main.rs"

[dependencies]
logicview-config = { path = "../logicview-config" }
logicview-engine = { path = "../logicview-engine" }
logicview-mcp = { path = "../logicview-mcp" }
logicview-ui = { path = "../logicview-ui" }
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
rfd = { version = "0.17.2", features = ["xdg-portal"] }
tao = "0.37.2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wry = "0.57.1"

[build-dependencies]
ico = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

[target."cfg(windows)".dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
rightkit-overlay-win = "0.1.0"
