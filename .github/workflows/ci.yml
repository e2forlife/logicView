name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: install WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config
      - name: test
        run: cargo test --workspace
      - name: check Windows release build
        run: |
          cargo check --release --target x86_64-pc-windows-msvc -p logicview-app
          cargo check --tests --target x86_64-pc-windows-msvc -p logicview-mcp
      - name: reject firmware blobs
        run: |
          set -euo pipefail
          found=$(find . -type f \( -name '*.fw' -o -name '*.bit' -o -name '*.bitstream' \) -print)
          if [ -n "$found" ]; then
            echo "firmware and bitstream blobs must not be committed:"
            echo "$found"
            exit 1
          fi
