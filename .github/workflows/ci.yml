name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        run: cargo test --workspace
      - name: reject firmware blobs
        run: |
          set -euo pipefail
          found=$(find . -type f \( -name '*.fw' -o -name '*.bit' -o -name '*.bitstream' \) -print)
          if [ -n "$found" ]; then
            echo "firmware and bitstream blobs must not be committed:"
            echo "$found"
            exit 1
          fi
