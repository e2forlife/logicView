name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install WebKitGTK
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config squashfs-tools
      - name: test
        run: cargo test --workspace
      - name: package Linux release
        run: scripts/package-release.sh
      - name: upload Linux release package
        uses: actions/upload-artifact@v4
        with:
          name: logicview-linux-x86_64
          path: |
            dist/logicview-*-linux-x86_64.tar.gz
            dist/logicview-*-x86_64.AppImage
          if-no-files-found: error
      - name: reject firmware blobs
        run: |
          set -euo pipefail
          found=$(find . -type f \( -name '*.fw' -o -name '*.bit' -o -name '*.bitstream' \) -print)
          if [ -n "$found" ]; then
            echo "firmware and bitstream blobs must not be committed:"
            echo "$found"
            exit 1
          fi

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build Windows release
        run: cargo build --release -p logicview-app
      - name: check Windows MCP tests
        run: cargo check --tests -p logicview-mcp
